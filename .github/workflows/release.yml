name: Release

# PyPI publishing for projects with Cython-compiled binary wheels is handled
# manually via `scaldys-project publish`.  Automated CI publishing would upload
# a pure-Python source distribution that exposes Cython source code on PyPI.
#
# Release workflow:
#   1. scaldys-project build all    → binary wheel in dist/ + Windows installer
#   2. scaldys-project publish      → upload binary wheel to PyPI
#   3. git tag v<version> && git push --tags  → triggers this workflow

on:
  push:
    tags:
      - v*

jobs:
  github_release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Extract notes for the current version from RELEASES.md
          # It looks for the section starting with ## [version] and ends at the next '---'
          VERSION="${{ github.ref_name }}"
          VERSION_CLEAN="${VERSION#v}" # remove 'v' prefix if present
          
          sed -n "/## \[$VERSION_CLEAN\]/,/---/p" RELEASES.md | sed '1d;$d' > release_notes.md
          
          # If extraction failed or file is empty, use auto-generated notes as fallback
          if [ -s release_notes.md ]; then
            gh release create "$VERSION" \
              --title "$VERSION" \
              --notes-file release_notes.md
          else
            gh release create "$VERSION" \
              --title "$VERSION" \
              --generate-notes
          fi
