# CI setup
# Lint, format code and documentation, check type consistency, run tests with coverage.
# No build step: binary wheels with Cython-compiled extensions are built locally
# via `scaldys-project build all` and published manually via `scaldys-project publish`.
name: Python Code Quality

on:
  pull_request:
  push:

jobs:
  code_quality:
    name: Lint format and type consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y tcl-dev tk-dev

      - name: UV verify lock file
        run: uv lock --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --diff .

      # This isn't a general Python lint, this style is just used in this repository
      - name: Prettier format
        run: uv run pre-commit run prettier --all-files

      - name: PyRight type consistency
        run: |
          uv sync
          uv run pyright ./src

  test:
    name: Run tests
    needs: [code_quality]
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y tcl-dev tk-dev

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake tcl-tk ninja

      - name: Pre-build tksvg without build isolation (macOS)
        # tksvg 0.7.4's setup.py invokes `pacman` to install cmake when its
        # own detection (shutil.which('cmake')) fails, which breaks on macOS
        # even when cmake is provided via Homebrew or the `cmake` PyPI
        # package.  We explicitly add brew's bin and the venv's bin to PATH
        # so tksvg's setup.py finds a working cmake and skips the pacman
        # fallback entirely.
        if: runner.os == 'macOS'
        run: |
          uv venv
          uv pip install --python .venv/bin/python scikit-build "cmake<3.31" setuptools wheel ninja
          BREW_PREFIX="$(brew --prefix)"
          export PATH="$PWD/.venv/bin:$BREW_PREFIX/bin:$BREW_PREFIX/opt/tcl-tk/bin:$PATH"
          export CMAKE_PREFIX_PATH="$BREW_PREFIX/opt/tcl-tk"
          echo "Using cmake at: $(which cmake)"
          echo "cmake version: $(cmake --version | head -n1)"
          uv pip install --python .venv/bin/python --no-build-isolation tksvg==0.7.4
          # Persist PATH/env for subsequent steps so `uv run pytest` reuses
          # the prebuilt tksvg without rebuilding from sdist.
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "$BREW_PREFIX/bin" >> "$GITHUB_PATH"
          echo "CMAKE_PREFIX_PATH=$BREW_PREFIX/opt/tcl-tk" >> "$GITHUB_ENV"

      - name: Run tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a uv run pytest -v --durations=0 --cov --cov-report=xml

      - name: Run tests (Non-Linux)
        if: runner.os != 'Linux'
        run: uv run pytest -v --durations=0 --cov --cov-report=xml