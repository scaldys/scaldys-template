code_quality:
  stage: quality
  image: python:3.13
  variables:
    UV_CACHE_DIR: .uv-cache
  before_script:
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    - export PATH="$HOME/.cargo/bin:$PATH"
  script:
    - |
      if [ "$CI_COMMIT_BRANCH" = "main" ] || [ "$CI_COMMIT_BRANCH" = "develop" ]; then
        uv lock --locked
        uv run ruff check .
      fi
    - uv run ruff format --diff .
    - uv run mdformat --check README.md
    - |
      if [ "$CI_COMMIT_BRANCH" = "main" ] || [ "$CI_COMMIT_BRANCH" = "develop" ]; then
        uv sync
        uv run pyright ./src
      fi
  cache:
    key:
      files:
        - uv.lock
    paths:
      - .uv-cache
