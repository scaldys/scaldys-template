[project]
name = "scaldys-template"
version = "0.20.1"
authors = [
  { name="scaldys-template", email="scaldys@scaldys.net" },
]
description = "A skeleton for Python projects by Scaldys."
readme = "README.md"
requires-python = ">=3.13"
classifiers = [
    "Programming Language :: Python",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Utilities",
]
license-files = ["LICEN[CS]E*"]
dependencies = [
    "art>=6.5",
    "click>=8.4.1",
    "lxml>=6.1.1",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pillow>=12.2.0",
    "platformdirs>=4.9.6",
    "pydantic>=2.0",
#    "PySide6>=6.8.0",
    "rich>=13.0",
    "tksvg>=0.7.4; sys_platform == 'win32'",
    "ttkbootstrap>=1.20.3",
    "typer>=0.27.1",
]

[project.optional-dependencies]
svg = ["tksvg>=0.7.4"]

[project.scripts]
scaldys-template = "scaldys_template.__main__:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["scaldys_template*"]

[tool.setuptools.package-data]
# Without tk/assets/..., the assets will not be included in the Python environment's site-packages,
# and the GUI will fail when launched via python -m scaldys_template gui or the installed script.
scaldys_template = ["py.typed", "tk/assets/fa/*.svg"]

[dependency-groups]
dev = [
    "scaldys-project[cython,windows,docs]>=0.31.1",
    "lxml-stubs>=0.5.1",
    "mdformat>=1.0.0",
    "pyright>=1.1.411",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.15.12",
    "sphinx>=9.1.0",
    "sphinx-rtd-theme>=3.1.0",
    "sphinx-lint>=1.0.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: Fast, isolated tests with no external I/O",
    "integration: Tests that touch the filesystem or invoke the full CLI",
    "slow: Tests that take significant time (excluded from fast CI runs)",
    "svg: Tests that require tksvg or native Tk 8.7+ SVG support",
]

#[tool.uv.sources]
#scaldys-project = { path = "../../scaldys-project", editable = true }

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [".uv-cache", "artifacts"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F403"]

[tool.pyright]
exclude = [".venv", "build", "dist", ".uv-cache", "artifacts"]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"

# Added for environment on GitHub to run actions
